<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>FIFA RANDOMIZER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            padding: 16px 12px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        #loader {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2rem;
            color: #555;
        }
        #loader .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a1a2e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            margin: 12px 0 24px;
            color: #111;
        }

        .fifa-version {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 6px;
            margin-bottom: 28px;
        }

        .fifa-btn {
            background: #f2f2f2;
            border: 2px solid transparent;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #222;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 auto;
        }

        .fifa-btn.active {
            background: #1a1a2e;
            color: white;
            border-color: #1a1a2e;
        }

        .team-type {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .type-btn {
            background: #eaeaea;
            border: none;
            border-radius: 40px;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #111;
            cursor: pointer;
            transition: 0.2s;
            flex: 0 1 auto;
        }

        .type-btn.active {
            background: #1a1a2e;
            color: white;
        }

        .teams-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            margin: 16px 0 20px;
        }

        .team-card {
            flex: 1 1 calc(50% - 8px);
            min-width: 200px;
            background: #f8f8f8;
            border-radius: 20px;
            padding: 16px 14px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #111;
        }

        .stars-select {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 10px 0 14px;
            width: 100%;
        }

        .star-btn {
            background: #e0e0e0;
            border: 2px solid transparent;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #222;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .star-btn img {
            width: 14px;
            height: 14px;
            display: block;
        }

        .star-btn.active {
            background: #1a1a2e;
            color: white;
            border-color: #1a1a2e;
        }

        .star-btn.select-all {
            background: #d4d4d4;
            font-size: 0.7rem;
            padding: 4px 10px;
        }
        .star-btn.select-all.active {
            background: #1a1a2e;
            color: white;
        }

        .randomize-btn {
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            max-width: 180px;
            cursor: pointer;
            transition: 0.2s;
            margin: 6px 0 10px;
        }

        .randomize-btn:active {
            transform: scale(0.96);
        }

        .result-area {
            width: 100%;
            min-height: 90px;
            background: white;
            border-radius: 16px;
            padding: 14px 10px;
            margin-top: 8px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .result-area .team-name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .result-area .team-detail {
            color: #333;
            font-size: 0.9rem;
        }
        .result-area .team-stars {
            display: flex;
            gap: 2px;
            margin-top: 4px;
        }
        .result-area .team-stars img {
            width: 18px;
            height: 18px;
            display: block;
        }
        .placeholder-text {
            color: #888;
            font-weight: 400;
        }
        .error-text {
            color: #d32f2f;
            font-weight: 600;
        }

        .stars-hint {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 4px;
            width: 100%;
            text-align: center;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .team-card { flex: 1 1 100%; }
            .fifa-btn { padding: 6px 14px; font-size: 0.85rem; }
            .type-btn { padding: 8px 18px; font-size: 0.9rem; }
            .star-btn img { width: 12px; height: 12px; }
            .result-area .team-stars img { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚽ FIFA RANDOMIZER</h1>

    <div id="loader">
        <div class="spinner"></div>
        <div>Загрузка данных...</div>
    </div>

    <div id="app" style="display: none;">
        <div class="fifa-version" id="fifaVersionContainer">
            <button class="fifa-btn active" data-version="26">FC 26</button>
            <button class="fifa-btn" data-version="25">FC 25</button>
            <button class="fifa-btn" data-version="24">FC 24</button>
            <button class="fifa-btn" data-version="23">FIFA 23</button>
            <button class="fifa-btn" data-version="22">FIFA 22</button>
        </div>

        <div class="team-type" id="teamTypeContainer">
            <button class="type-btn active" data-type="club">Club Teams</button>
            <button class="type-btn" data-type="national">International Teams</button>
        </div>

        <div class="teams-row">
            <div class="team-card" id="teamOneCard">
                <h3>Team One</h3>
                <div class="stars-select" id="starsOneContainer">
                    <div class="stars-hint">Нажмите на звёзды (можно несколько)</div>
                    <button class="star-btn select-all active" data-target="one" data-stars="all">Все</button>
                    <button class="star-btn active" data-target="one" data-stars="5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="4.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="4">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="3.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="3">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="2.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="2">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="1.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="one" data-stars="1">
                        <img src="images/star-full.png" alt="★">
                    </button>
                </div>
                <button class="randomize-btn" data-target="one">Randomize</button>
                <div class="result-area" id="resultOne">
                    <span class="placeholder-text">Нажмите Randomize</span>
                </div>
            </div>

            <div class="team-card" id="teamTwoCard">
                <h3>Team Two</h3>
                <div class="stars-select" id="starsTwoContainer">
                    <div class="stars-hint">Нажмите на звёзды (можно несколько)</div>
                    <button class="star-btn select-all active" data-target="two" data-stars="all">Все</button>
                    <button class="star-btn active" data-target="two" data-stars="5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="4.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="4">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="3.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="3">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="2.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="2">
                        <img src="images/star-full.png" alt="★"><img src="images/star-full.png" alt="★">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="1.5">
                        <img src="images/star-full.png" alt="★"><img src="images/star-half.png" alt="½">
                    </button>
                    <button class="star-btn active" data-target="two" data-stars="1">
                        <img src="images/star-full.png" alt="★">
                    </button>
                </div>
                <button class="randomize-btn" data-target="two">Randomize</button>
                <div class="result-area" id="resultTwo">
                    <span class="placeholder-text">Нажмите Randomize</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- СОСТОЯНИЕ ----------
        let state = {
            fifaVersion: '26',
            teamType: 'club',
            starsOne: new Set([5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1]),
            starsTwo: new Set([5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1])
        };

        let allTeams = [];

        // DOM
        const loader = document.getElementById('loader');
        const app = document.getElementById('app');
        const fifaBtns = document.querySelectorAll('#fifaVersionContainer .fifa-btn');
        const typeBtns = document.querySelectorAll('#teamTypeContainer .type-btn');
        const resultOne = document.getElementById('resultOne');
        const resultTwo = document.getElementById('resultTwo');
        const randomBtns = document.querySelectorAll('.randomize-btn');

        // ---------- ЗАГРУЗКА ДАННЫХ ----------
        function loadData() {
            fetch('TEAMS.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!Array.isArray(data)) {
                        throw new Error('Данные должны быть массивом');
                    }
                    allTeams = data;
                    console.log(`✅ Загружено ${allTeams.length} команд`);
                    onDataLoaded();
                })
                .catch(error => {
                    console.error('❌ Ошибка загрузки:', error);
                    loader.innerHTML = `
                        <div class="error-text">⚠️ Ошибка загрузки данных</div>
                        <p style="margin-top:12px;font-size:0.9rem;color:#666;">
                            Проверьте, что файл <strong>TEAMS.json</strong> находится в той же папке, что и index.html<br>
                            <span style="font-size:0.8rem;">${error.message}</span>
                        </p>
                        <button onclick="location.reload()" style="margin-top:16px;padding:10px 30px;border-radius:30px;border:2px solid #1a1a2e;background:white;font-weight:600;cursor:pointer;">
                            🔄 Обновить
                        </button>
                    `;
                });
        }

        // ---------- ПОСЛЕ ЗАГРУЗКИ ----------
        function onDataLoaded() {
            loader.style.display = 'none';
            app.style.display = 'block';
            initStarHandlers();
            updateUI();
            resultOne.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
            resultTwo.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
        }

        // ---------- ФУНКЦИЯ ДЛЯ ОТОБРАЖЕНИЯ ЗВЁЗД В РЕЗУЛЬТАТЕ ----------
        function renderStars(starsValue) {
            const num = parseFloat(starsValue);
            if (isNaN(num)) return '';
            const full = Math.floor(num);
            const half = (num - full) >= 0.5 ? 1 : 0;
            let html = '';
            for (let i = 0; i < full; i++) {
                html += `<img src="images/star-full.png" alt="★">`;
            }
            if (half) {
                html += `<img src="images/star-half.png" alt="½">`;
            }
            return html;
        }

        // ---------- ОБРАБОТЧИКИ ДЛЯ ЗВЁЗД ----------
        function initStarHandlers() {
            const allStarButtons = document.querySelectorAll('.star-btn');

            allStarButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();

                    const target = this.dataset.target;
                    const starsValue = this.dataset.stars;
                    const set = target === 'one' ? state.starsOne : state.starsTwo;

                    if (starsValue === 'all') {
                        const allStars = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1];
                        const allSelected = allStars.every(s => set.has(s));

                        if (allSelected) {
                            set.clear();
                        } else {
                            allStars.forEach(s => set.add(s));
                        }

                        updateStarUI(target, set);
                        return;
                    }

                    const star = parseFloat(starsValue);
                    if (set.has(star)) {
                        set.delete(star);
                    } else {
                        set.add(star);
                    }

                    updateStarUI(target, set);
                });
            });
        }

        function updateStarUI(target, set) {
            const containerId = target === 'one' ? '#starsOneContainer' : '#starsTwoContainer';
            const buttons = document.querySelectorAll(`${containerId} .star-btn`);

            const allStars = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1];
            const allSelected = allStars.every(s => set.has(s));

            buttons.forEach(btn => {
                if (btn.dataset.stars === 'all') {
                    btn.classList.toggle('active', allSelected);
                } else {
                    const star = parseFloat(btn.dataset.stars);
                    btn.classList.toggle('active', set.has(star));
                }
            });
        }

        // ---------- ФИЛЬТРАЦИЯ ----------
        function getFilteredTeams() {
            const versionMap = {
                '22': 'FIFA 22',
                '23': 'FIFA 23',
                '24': 'EA SPORTS FC 24',
                '25': 'EA SPORTS FC 25',
                '26': 'EA SPORTS FC 26'
            };
            const targetVersion = versionMap[state.fifaVersion] || 'FIFA 22';
            const targetType = state.teamType === 'club' ? 'клуб' : 'сборная';

            return allTeams.filter(team => {
                const versionMatch = team['Версия FIFA'] === targetVersion;
                const typeMatch = team['Тип (клуб/сборная)']?.toLowerCase() === targetType;
                return versionMatch && typeMatch;
            });
        }

        function getTeamsByStars(teams, starsSet) {
            if (starsSet.size === 0) return [];
            return teams.filter(team => {
                const teamStars = parseFloat(team['Звёзды команды']);
                return starsSet.has(teamStars);
            });
        }

        function pickRandom(teams) {
            if (!teams || teams.length === 0) return null;
            const idx = Math.floor(Math.random() * teams.length);
            return teams[idx];
        }

        // ---------- ОТОБРАЖЕНИЕ РЕЗУЛЬТАТА ----------
        function renderResult(container, team) {
            if (!team) {
                container.innerHTML = `<span class="placeholder-text">Нет команд с такими звёздами</span>`;
                return;
            }
            const starsHtml = renderStars(team['Звёзды команды']);
            container.innerHTML = `
                <div class="team-name">${team['Название команды'] || 'Без названия'}</div>
                <div class="team-detail">${team['Страна'] || ''} • ${team['Лига'] || ''}</div>
                <div class="team-stars">${starsHtml}</div>
            `;
        }

        // ---------- РАНДОМИЗАЦИЯ ----------
        function randomize(target) {
            const starsSet = target === 'one' ? state.starsOne : state.starsTwo;
            const filtered = getFilteredTeams();
            const candidates = getTeamsByStars(filtered, starsSet);
            const chosen = pickRandom(candidates);
            const container = target === 'one' ? resultOne : resultTwo;
            renderResult(container, chosen);
        }

        // ---------- ОБНОВЛЕНИЕ ОСТАЛЬНОГО UI ----------
        function updateUI() {
            fifaBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.version === state.fifaVersion);
            });

            typeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === state.teamType);
            });

            updateStarUI('one', state.starsOne);
            updateStarUI('two', state.starsTwo);
        }

        // ---------- ОБРАБОТЧИКИ (FIFA версии и тип) ----------
        fifaBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                state.fifaVersion = this.dataset.version;
                updateUI();
                resultOne.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
                resultTwo.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
            });
        });

        typeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                state.teamType = this.dataset.type;
                updateUI();
                resultOne.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
                resultTwo.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
            });
        });

        randomBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const target = this.dataset.target;
                randomize(target);
            });
        });

        // ---------- ЗАПУСК ----------
        loadData();
    })();
</script>

</body>
</html>
