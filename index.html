<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>FIFA RANDOMIZER</title>
    <style>
        /* Сброс и базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            padding: 16px 12px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Заголовок */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            margin: 12px 0 24px;
            color: #111;
        }

        /* Выбор версии FIFA */
        .fifa-version {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 6px;
            margin-bottom: 28px;
        }

        .fifa-btn {
            background: #f2f2f2;
            border: 2px solid transparent;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #222;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 auto;
        }

        .fifa-btn.active {
            background: #1a1a2e;
            color: white;
            border-color: #1a1a2e;
        }

        /* Выбор типа команд (клубы / сборные) */
        .team-type {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .type-btn {
            background: #eaeaea;
            border: none;
            border-radius: 40px;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #111;
            cursor: pointer;
            transition: 0.2s;
            flex: 0 1 auto;
        }

        .type-btn.active {
            background: #1a1a2e;
            color: white;
        }

        /* Блоки Team One и Team Two */
        .teams-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            margin: 16px 0 20px;
        }

        .team-card {
            flex: 1 1 calc(50% - 8px);
            min-width: 200px;
            background: #f8f8f8;
            border-radius: 20px;
            padding: 16px 14px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #111;
        }

        .stars-select {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 10px 0 14px;
            width: 100%;
        }

        .star-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #222;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }

        .star-btn.active {
            background: #1a1a2e;
            color: white;
        }

        .randomize-btn {
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            max-width: 180px;
            cursor: pointer;
            transition: 0.2s;
            margin: 6px 0 10px;
        }

        .randomize-btn:active {
            transform: scale(0.96);
        }

        .result-area {
            width: 100%;
            min-height: 90px;
            background: white;
            border-radius: 16px;
            padding: 14px 10px;
            margin-top: 8px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .result-area img {
            max-width: 48px;
            height: auto;
            margin-bottom: 6px;
        }

        .result-area .team-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .result-area .team-detail {
            color: #333;
            font-size: 0.9rem;
        }

        .placeholder-text {
            color: #888;
            font-weight: 400;
        }

        /* Адаптация под телефон */
        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .team-card { flex: 1 1 100%; }
            .fifa-btn { padding: 6px 14px; font-size: 0.85rem; }
            .type-btn { padding: 8px 18px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚽ FIFA RANDOMIZER</h1>

    <!-- Версии FIFA -->
    <div class="fifa-version" id="fifaVersionContainer">
        <button class="fifa-btn active" data-version="26">FC 26</button>
        <button class="fifa-btn" data-version="25">FC 25</button>
        <button class="fifa-btn" data-version="24">FC 24</button>
        <button class="fifa-btn" data-version="23">FIFA 23</button>
        <button class="fifa-btn" data-version="22">FIFA 22</button>
    </div>

    <!-- Клубы / Сборные -->
    <div class="team-type" id="teamTypeContainer">
        <button class="type-btn active" data-type="club">Club Teams</button>
        <button class="type-btn" data-type="national">International Teams</button>
    </div>

    <!-- Блоки Team One и Team Two -->
    <div class="teams-row">
        <!-- Team One -->
        <div class="team-card" id="teamOneCard">
            <h3>Team One</h3>
            <div class="stars-select" id="starsOneContainer">
                <button class="star-btn active" data-stars="5">5★</button>
                <button class="star-btn" data-stars="4.5">4.5★</button>
                <button class="star-btn" data-stars="4">4★</button>
                <button class="star-btn" data-stars="3.5">3.5★</button>
                <button class="star-btn" data-stars="3">3★</button>
                <button class="star-btn" data-stars="2.5">2.5★</button>
                <button class="star-btn" data-stars="2">2★</button>
                <button class="star-btn" data-stars="1.5">1.5★</button>
                <button class="star-btn" data-stars="1">1★</button>
            </div>
            <button class="randomize-btn" data-target="one">Randomize</button>
            <div class="result-area" id="resultOne">
                <span class="placeholder-text">Нажмите Randomize</span>
            </div>
        </div>

        <!-- Team Two -->
        <div class="team-card" id="teamTwoCard">
            <h3>Team Two</h3>
            <div class="stars-select" id="starsTwoContainer">
                <button class="star-btn active" data-stars="5">5★</button>
                <button class="star-btn" data-stars="4.5">4.5★</button>
                <button class="star-btn" data-stars="4">4★</button>
                <button class="star-btn" data-stars="3.5">3.5★</button>
                <button class="star-btn" data-stars="3">3★</button>
                <button class="star-btn" data-stars="2.5">2.5★</button>
                <button class="star-btn" data-stars="2">2★</button>
                <button class="star-btn" data-stars="1.5">1.5★</button>
                <button class="star-btn" data-stars="1">1★</button>
            </div>
            <button class="randomize-btn" data-target="two">Randomize</button>
            <div class="result-area" id="resultTwo">
                <span class="placeholder-text">Нажмите Randomize</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- БАЗА ДАННЫХ КОМАНД (клубы + сборные) ----------
        // Структура: { name, country, league, stars, type, emblem }
        // Для демонстрации добавлены топ-клубы и сборные из FIFA 22-26.
        // Вы можете дополнить этот список своими данными.
        const ALL_TEAMS = [
            // === КЛУБЫ (пример) ===
            { name: "Реал Мадрид", country: "Испания", league: "La Liga", stars: 5, type: "club", emblem: "https://cdn.sofifa.net/flags/es.png" },
            { name: "Барселона", country: "Испания", league: "La Liga", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/es.png" },
            { name: "Атлетико", country: "Испания", league: "La Liga", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/es.png" },
            { name: "Бавария", country: "Германия", league: "Bundesliga", stars: 5, type: "club", emblem: "https://cdn.sofifa.net/flags/de.png" },
            { name: "Боруссия Дортмунд", country: "Германия", league: "Bundesliga", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/de.png" },
            { name: "Манчестер Сити", country: "Англия", league: "Premier League", stars: 5, type: "club", emblem: "https://cdn.sofifa.net/flags/gb.png" },
            { name: "Ливерпуль", country: "Англия", league: "Premier League", stars: 5, type: "club", emblem: "https://cdn.sofifa.net/flags/gb.png" },
            { name: "Челси", country: "Англия", league: "Premier League", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/gb.png" },
            { name: "Арсенал", country: "Англия", league: "Premier League", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/gb.png" },
            { name: "ПСЖ", country: "Франция", league: "Ligue 1", stars: 5, type: "club", emblem: "https://cdn.sofifa.net/flags/fr.png" },
            { name: "Милан", country: "Италия", league: "Serie A", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/it.png" },
            { name: "Интер", country: "Италия", league: "Serie A", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/it.png" },
            { name: "Ювентус", country: "Италия", league: "Serie A", stars: 4.5, type: "club", emblem: "https://cdn.sofifa.net/flags/it.png" },
            { name: "Наполи", country: "Италия", league: "Serie A", stars: 4, type: "club", emblem: "https://cdn.sofifa.net/flags/it.png" },
            { name: "Аякс", country: "Нидерланды", league: "Eredivisie", stars: 4, type: "club", emblem: "https://cdn.sofifa.net/flags/nl.png" },
            { name: "Порту", country: "Португалия", league: "Primeira Liga", stars: 4, type: "club", emblem: "https://cdn.sofifa.net/flags/pt.png" },
            { name: "Спортинг", country: "Португалия", league: "Primeira Liga", stars: 3.5, type: "club", emblem: "https://cdn.sofifa.net/flags/pt.png" },

            // === СБОРНЫЕ (пример) ===
            { name: "Сборная Аргентины", country: "Аргентина", league: "International", stars: 5, type: "national", emblem: "https://cdn.sofifa.net/flags/ar.png" },
            { name: "Сборная Бразилии", country: "Бразилия", league: "International", stars: 5, type: "national", emblem: "https://cdn.sofifa.net/flags/br.png" },
            { name: "Сборная Франции", country: "Франция", league: "International", stars: 5, type: "national", emblem: "https://cdn.sofifa.net/flags/fr.png" },
            { name: "Сборная Англии", country: "Англия", league: "International", stars: 5, type: "national", emblem: "https://cdn.sofifa.net/flags/gb.png" },
            { name: "Сборная Бельгии", country: "Бельгия", league: "International", stars: 4.5, type: "national", emblem: "https://cdn.sofifa.net/flags/be.png" },
            { name: "Сборная Португалии", country: "Португалия", league: "International", stars: 4.5, type: "national", emblem: "https://cdn.sofifa.net/flags/pt.png" },
            { name: "Сборная Испании", country: "Испания", league: "International", stars: 4.5, type: "national", emblem: "https://cdn.sofifa.net/flags/es.png" },
            { name: "Сборная Германии", country: "Германия", league: "International", stars: 4.5, type: "national", emblem: "https://cdn.sofifa.net/flags/de.png" },
            { name: "Сборная Италии", country: "Италия", league: "International", stars: 4.5, type: "national", emblem: "https://cdn.sofifa.net/flags/it.png" },
            { name: "Сборная Нидерландов", country: "Нидерланды", league: "International", stars: 4.5, type: "national", emblem: "https://cdn.sofifa.net/flags/nl.png" },
        ];

        // ---------- СОСТОЯНИЕ ----------
        let state = {
            fifaVersion: '26',       // '22'..'26'
            teamType: 'club',        // 'club' | 'national'
            starsOne: 5,
            starsTwo: 5
        };

        // ---------- DOM-ЭЛЕМЕНТЫ ----------
        const fifaBtns = document.querySelectorAll('#fifaVersionContainer .fifa-btn');
        const typeBtns = document.querySelectorAll('#teamTypeContainer .type-btn');
        const starOneBtns = document.querySelectorAll('#starsOneContainer .star-btn');
        const starTwoBtns = document.querySelectorAll('#starsTwoContainer .star-btn');
        const resultOne = document.getElementById('resultOne');
        const resultTwo = document.getElementById('resultTwo');
        const randomBtns = document.querySelectorAll('.randomize-btn');

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function getFilteredTeams() {
            // Фильтр по типу (клуб / сборная) и звёздам (для каждой команды своя звезда)
            const type = state.teamType;
            return ALL_TEAMS.filter(t => t.type === type);
        }

        function getTeamsByStars(teams, stars) {
            return teams.filter(t => t.stars === stars);
        }

        function pickRandom(teams) {
            if (!teams || teams.length === 0) return null;
            const idx = Math.floor(Math.random() * teams.length);
            return teams[idx];
        }

        function renderResult(container, team) {
            if (!team) {
                container.innerHTML = `<span class="placeholder-text">Нет команд с такими звёздами</span>`;
                return;
            }
            container.innerHTML = `
                <img src="${team.emblem || ''}" alt="эмблема" style="width:40px;height:40px;object-fit:contain;">
                <div class="team-name">${team.name}</div>
                <div class="team-detail">${team.country} • ${team.league}</div>
                <div style="font-size:0.8rem;color:#555;margin-top:4px;">⭐ ${team.stars}</div>
            `;
        }

        // ---------- ОСНОВНАЯ ЛОГИКА РАНДОМИЗАЦИИ ----------
        function randomize(target) {
            const stars = target === 'one' ? state.starsOne : state.starsTwo;
            const filtered = getFilteredTeams();
            const candidates = getTeamsByStars(filtered, stars);
            const chosen = pickRandom(candidates);
            const container = target === 'one' ? resultOne : resultTwo;
            renderResult(container, chosen);
        }

        // ---------- ОБНОВЛЕНИЕ АКТИВНЫХ КНОПОК (UI) ----------
        function updateUI() {
            // Версии FIFA
            fifaBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.version === state.fifaVersion);
            });
            // Тип команды
            typeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === state.teamType);
            });
            // Звёзды One
            starOneBtns.forEach(btn => {
                const val = parseFloat(btn.dataset.stars);
                btn.classList.toggle('active', val === state.starsOne);
            });
            // Звёзды Two
            starTwoBtns.forEach(btn => {
                const val = parseFloat(btn.dataset.stars);
                btn.classList.toggle('active', val === state.starsTwo);
            });
        }

        // ---------- ОБРАБОТЧИКИ СОБЫТИЙ ----------
        // Выбор версии FIFA
        fifaBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                state.fifaVersion = this.dataset.version;
                updateUI();
                // Можно очистить результаты при смене версии (по желанию)
                resultOne.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
                resultTwo.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
            });
        });

        // Выбор типа (клубы / сборные)
        typeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                state.teamType = this.dataset.type;
                updateUI();
                resultOne.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
                resultTwo.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
            });
        });

        // Выбор звёзд для Team One
        starOneBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                state.starsOne = parseFloat(this.dataset.stars);
                updateUI();
            });
        });

        // Выбор звёзд для Team Two
        starTwoBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                state.starsTwo = parseFloat(this.dataset.stars);
                updateUI();
            });
        });

        // Кнопки Randomize
        randomBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const target = this.dataset.target; // 'one' или 'two'
                randomize(target);
            });
        });

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        updateUI();
        // По умолчанию показываем заглушки
        resultOne.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
        resultTwo.innerHTML = `<span class="placeholder-text">Нажмите Randomize</span>`;
    })();
</script>

</body>
</html>
